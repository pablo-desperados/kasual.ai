[project]
name = "kasual-ai"
version = "0.1.0"
description = "An LLM for casual conversation and humor"
requires-python = ">=3.11"
dependencies = [
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "transformers>=5.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pre_process"]

[dependency-groups]
scrape = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
]
